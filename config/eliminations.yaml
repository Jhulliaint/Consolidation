    expense_lines: []          # contrepartie non identifiee -> Q-7.2

# ---------------------------------------------------------------------------
# 3. Marge en stock chez les filiales
#    Les captions "Stock ... subsidiaries" isolent les stocks acquis aupres de
#    MAGE SAS. Le retraitement de la marge interne n'a PAS pu etre observe.
#    => desactive par defaut, taux a fournir par le client (Q-7.4).
# ---------------------------------------------------------------------------
unrealised_margin_on_stock:
  enabled: false
  stock_lines:
    - Stock shoes subsidiaries
    - Stock sneakers subsidiaries
    - Stock loafers subsidiaries
    - Stock sandals subsidiaries
    - Stock belts subsidiaries
    - Stock SLG subsidiaries
    - Stock LG subsidiaries
    - Stock other items subsidiaries
  margin_rate: null
  counterpart_line: Retained earnings/losses
