    revenue_lines: [Shoe Sales subsidiaries]
    expense_lines: [Purchases shoes from Mage]
  - name: Ventes sneakers intragroupe
    revenue_lines: [Sneaker Sales subsidiaries]
    expense_lines: [Purchases sneakers from Mage]
  - name: Ventes loafers intragroupe
    revenue_lines: [Loafer Sales subsidiaries]
    expense_lines: [Purchases loafers from Mage]
  - name: Ventes sandales intragroupe
    revenue_lines: [Sandal Sales subsidiaries]
    expense_lines: [Purchases sandals from Mage]
  - name: Ventes ceintures intragroupe
    revenue_lines: [Belt Sales subsidiaries]
    expense_lines: [Purchases belts from Mage]
  - name: Ventes SLG intragroupe
    revenue_lines: [SLG Sales subsidiaries]
    expense_lines: [Purchases SLG from Mage]
  - name: Ventes LG intragroupe
