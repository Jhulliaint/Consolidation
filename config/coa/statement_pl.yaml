# ---------------------------------------------------------------------------
# Cascade de resultat (FAIT OBSERVE - formules du classeur de reference)
# ---------------------------------------------------------------------------
cascade:
  - caption: Revenue
    from_total: Total revenue
  - caption: Cost of revenue
    from_total: Total cost of revenue
  - caption: Gross Profit/(Loss)
    sum_of: [Revenue, Cost of revenue]
  - caption: Selling, Marketing & Administrative expenses
    from_total: Total operating expenses
  - caption: Profit/(Loss) from operations
    sum_of: ["Gross Profit/(Loss)", "Selling, Marketing & Administrative expenses"]
  - caption: Interest income
    from_line: Interest income
  - caption: Interest expense
    from_line: Interest expense
  - caption: Profit/(loss) on foreign currency
    from_line: Profit/(loss) on foreign currency
  - caption: Profit/(loss) on Sale of Assets
    from_line: Profit/(loss) on Sale of Assets
  - caption: Other income (expense) net
    from_line: Other income (expense) net
  - caption: Restructuring charges
    from_line: Restructuring charges
  - caption: Profit/(Loss) before income tax
    sum_of:
      - Profit/(Loss) from operations
      - Interest income
      - Interest expense
      - Profit/(loss) on foreign currency
      - Profit/(loss) on Sale of Assets
      - Other income (expense) net
      - Restructuring charges
  - caption: Corporate income tax
    from_line: Corporate income tax
  - caption: Total Net/(loss) Profit
    sum_of: [Profit/(Loss) before income tax, Corporate income tax]
  - caption: Non-controlling interest P/L
    from_line: Non-controlling interest P/L
  - caption: Total Group Net/(loss) Profit
    sum_of: [Total Net/(loss) Profit, Non-controlling interest P/L]

# EBITA tel que defini dans le classeur de reference.
# ATTENTION : cette definition inclut le resultat de change et les elements
# non recurrents ; ce n'est donc pas un EBITA au sens usuel (cf. anomalie A-07).
# Verifie sur 2025 : 33 199 + 32 264 - 437 450 + 0 - 188 713 + 0 = -560 700.
ebita:
  base: Profit/(Loss) from operations
  add_back: [Depreciation]
  plus:
    - Profit/(loss) on foreign currency
    - Profit/(loss) on Sale of Assets
    - Other income (expense) net
    - Restructuring charges

# Analyse de marge par famille de produits - FAIT OBSERVE : bloc F:M lignes
# 28-31 de "Detailed Consolidated PL" (EC+/2025.xlsx). Les regroupements
# reprennent les plages des formules d'origine, par exemple :
#   SHOES   revenu = SUM(C13:C14)   cout = SUM(C52:C63)
#   SLG     revenu = C28 + C29      cout = SUM(C90:C98)
#   BESPOKE revenu = C37            cout = SUM(C115:C123)
#   BESPOKE & SHOES = SHOES + BESPOKE
# NB (FAIT OBSERVE) : la main-d'oeuvre et les frais de fabrication, les
# matieres premieres et les en-cours sont integralement affectes a SHOES ;
# les sandales et les "autres" ne figurent dans aucune famille.
margin_families:
  SLG:
    revenue: [SLG Sales, SLG Sales distributors]
    cost:
      - Opening stock SLG Mage SAS
      - Purchases SLG
      - Raw material consumed for SLG
      - Subcontractor for SLG
      - Closing stock SLG Mage SAS
      - Other costs SLG
      - Opening stock SLG subsidiaries
      - Purchases SLG from Mage
      - Closing stock SLG subsidiaries
  LG:
    revenue: [LG Sales, LG Sales distributors]
    cost:
      - Opening stock LG
      - Purchases raw material for LG
      - Subcontractor for LG
      - Closing stock LG
      - Opening stock LG subsidiaries
      - Purchases LG from Mage
      - Closing stock LG subsidiaries
  SHOES:
    revenue: [Shoe Sales, Shoe Sales distributors]
    cost:
      - Manufacturing labour costs
      - Manufacturing overhead costs
      - Opening stock raw material
      - Purchases raw material
      - Closing stock raw material
      - Opening stock in progress
      - Closing stock in progress
      - Opening stock shoes Mage SAS
      - Closing stock shoes Mage SAS
      - Opening stock shoes subsidiaries
      - Purchases shoes from Mage
      - Closing stock shoes subsidiaries
  SNEAKERS:
    revenue: [Sneaker Sales, Sneaker Sales distributors]
