      - Opening stock sneakers
      - Purchases sneakers
      - Closing stock sneakers
      - Opening stock sneakers subsidiaries
      - Purchases sneakers from Mage
      - Closing stock sneakers subsidiaries
  LOAFERS:
    revenue: [Loafer Sales, Loafer Sales distributors]
    cost:
      - Opening stock loafers
      - Purchases Shoes Loafers
      - Closing stock loafers
      - Opening stock loafers subsidiaries
      - Purchases loafers from Mage
      - Closing stock loafers subsidiaries
  BELT:
    revenue: [Belt Sales, Belt Sales distributors]
