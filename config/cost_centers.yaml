# Colonnes techniques du rapport par centre de couts (FAIT OBSERVE)
technical_columns:
  - ELIMINATION
  - TOTAL MAGE CONSOLIDATED ACCOUNTS

# Cle de repartition : AUCUNE cle de repartition (driver) n'a ete trouvee dans
# les fichiers analyses. L'affectation analytique semble DIRECTE (chaque ecriture
# porte sa section). HYPOTHESE A VALIDER -> Q-5.1 / Q-5.2.
allocation:
  method: direct
  drivers: []
  # Centre de couts applique lorsque la source ne porte aucune section :
  default_cost_center: UNALLOCATED
