# AXE ANALYTIQUE : CENTRES DE COUTS
#
# PROVENANCE :
#  - codes 921S* : liste "Colonne1/Colonne2" (colonnes D:E) de la feuille
#    "Mapping" de MAPPING MAGE SAS.xlsx  -> sections analytiques Sage de MAGE SAS
#  - libelles de colonnes : feuille "Conso <date> CC-local cur" du classeur
#    "Mage SAS Consolidated accounts ... by cost center"
#
# STATUT : les codes et libelles sont des FAITS OBSERVES.
#          Le rattachement d'un centre de couts a une entite est une DEDUCTION
#          (issue de la position des colonnes sous chaque entite).

# ---------------------------------------------------------------------------
# Sections analytiques internes de MAGE SAS (plan Sage)
# NB : plusieurs codes pointent vers le meme centre de couts -> cf. anomalie A-02
# ---------------------------------------------------------------------------
analytic_sections:
  "921S0":  HEADQUARTERS
  "921S1":  HEADQUARTERS
  "921S2":  HEADQUARTERS
  "921S3":  MANUFACTURE
  "921S4":  HEADQUARTERS
  "921S5":  HEADQUARTERS
  "921S6":  VOLNEY
  "921S9":  WHOLESALES
  "921S11": SUB
  "921S12": VOLNEY
  "921S14": E COMMERCE
  "921S15": HAUTE CORDONNERIE

# ---------------------------------------------------------------------------
# Centres de couts de restitution, par entite
# ---------------------------------------------------------------------------
