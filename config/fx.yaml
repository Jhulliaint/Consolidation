# CONVERSION DE DEVISES
#
# PROVENANCE : feuilles "Rate", "Annual average rate", "Moyenne Mensuelle",
# "EOM" et "Taux EOM ZAR" du classeur "AA Mage SAS Consolidated accounts 2023
# MARGIN.xlsx" + feuille "Rate" du classeur "by cost center".
#
# FAITS OBSERVES :
#  - trois types de taux coexistent : EOM (fin de mois), Average (moyen), Historical
#  - source citee dans le classeur : www.banque-france.fr
#  - devises gerees : AED, GBP, HKD, JPY, KRW, ZAR, CNY  (cotation INDIRECTE :
#    1 EUR = X devise ; ex. JPY 156,33 ; GBP 0,8391)
#  - le nombre de mois de la periode est lu dans le fichier Cashflow statements
#    (formule =MONTH(...[Cashflow statements Mage SAS 2023.xlsx]Cover'!$F$41))
#
# DEDUCTION (usage standard, coherent avec la presence des trois taux) :
#  - postes de BILAN      -> taux EOM de la date de cloture
#  - postes de RESULTAT   -> taux MOYEN de la periode
#  - CAPITAL / primes     -> taux HISTORIQUE
#  - l'ecart de conversion alimente "Consolidation reserves" /
#    "Accumlated other comprehensive profit/loss"
# STATUT : A VALIDER -> Q-6.1 a Q-6.4

base_currency: EUR
quotation: indirect          # 1 EUR = <rate> devise
source: "Banque de France (www.banque-france.fr)"

# Regle de taux par type de poste
rate_policy:
  BALANCE_SHEET: eom
  PROFIT_AND_LOSS: average
  EQUITY_HISTORICAL: historical

# Postes du bilan convertis au taux historique (HYPOTHESE - Q-6.3)
historical_lines:
  - Share capital
  - Additional paid in capital

# Poste recevant l'ecart de conversion (HYPOTHESE - Q-6.4)
translation_difference_line: Consolidation reserves

