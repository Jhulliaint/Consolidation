[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mageconso"
version = "0.1.0"
description = "Consolidation automatisee des management accounts Mage SAS"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
mageconso = "mageconso.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
